name: Full HTML portfolio
on:
  push:
    branches: [main]
    paths:
      - "tools/site/**"
      - ".github/workflows/full-html-site.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: full-html-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Fetch and verify pinned sources and dependencies
        run: python3 tools/site/prepare.py
      - name: Build complete static HTML site
        run: node tools/site/build-site.mjs
      - name: Check page links and anchors
        run: python3 tools/site/check-site.py
      - name: Validate security invariants and JavaScript syntax
        run: python3 tools/site/security-validate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloudflare-static-site
          path: tools/site/dist
          include-hidden-files: true
