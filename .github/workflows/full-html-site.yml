name: Full HTML portfolio
on:
  push:
    branches: [main]
    paths:
      - "tools/site/**"
      - ".github/workflows/full-html-site.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: full-html-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch and verify pinned sources and dependencies
        run: python3 tools/site/prepare.py
      - name: Build complete static HTML site
        run: node tools/site/build-site.mjs
      - name: Check page links and anchors
        run: python3 tools/site/check-site.py
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-static-site
          path: tools/site/dist
          include-hidden-files: true
